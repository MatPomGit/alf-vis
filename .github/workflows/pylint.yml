name: Pylint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]" pylint
    - name: Analysing the code with pylint
      run: |
        # OpenCV exposes members through a native extension rather than Python source.
        # Optional lib-ros probe has a separate lint job with its dependency installed.
        # The core application still supports Python 3.10; lib-ros requires >=3.11.
        git ls-files -z '*.py' ':!tools/lib_ros_probe.py' | xargs -0 python -m pylint --extension-pkg-allow-list=cv2
