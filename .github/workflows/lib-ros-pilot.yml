name: lib-ros consumer pilot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --no-deps -r requirements-lib-ros.txt
      - name: Confirm installed library commit
        run: |
          python - <<'PY'
          import json
          from importlib.metadata import distribution
          from pathlib import Path
          expected = Path("requirements-lib-ros.txt").read_text().strip().split("@")[-1]
          actual = json.loads(distribution("lib-ros").read_text("direct_url.json"))["vcs_info"]["commit_id"]
          assert actual == expected, (actual, expected)
          print("lib-ros commit:", actual)
          PY
      - name: Lint optional probe on supported Python
        run: |
          python -m pip install pylint
          python -m pylint tools/lib_ros_probe.py
      - run: python tools/lib_ros_probe.py --self-test
